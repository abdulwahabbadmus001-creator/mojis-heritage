name: Scheduled Nigerian Heritage API Sync

on:
  schedule:
    # Runs automatically every day at 04:00 UTC (05:00 WAT Africa/Lagos)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  sync-heritage-sources:
    name: Sync External Open-Access Nigerian Heritage APIs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Execute scheduled external API sync
        run: node scripts/sync-external-heritage.mjs

      - name: Run automated security and archive verification tests
        run: npm test

      - name: Commit updated discovery snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/external-discoveries-snapshot.json; then
            git add public/external-discoveries-snapshot.json
            git commit -m "chore(sync): automated Nigerian heritage external API snapshot refresh [skip ci]"
            git push
          else
            echo "No snapshot changes detected."
          fi

      - name: Resolve and verify Firebase web configuration for production build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const envFile = process.env.GITHUB_ENV;
            const current = {
              VITE_FIREBASE_API_KEY: (process.env.VITE_FIREBASE_API_KEY || "").trim(),
              VITE_FIREBASE_AUTH_DOMAIN: (process.env.VITE_FIREBASE_AUTH_DOMAIN || "").trim(),
              VITE_FIREBASE_PROJECT_ID: (process.env.VITE_FIREBASE_PROJECT_ID || "").trim(),
              VITE_FIREBASE_STORAGE_BUCKET: (process.env.VITE_FIREBASE_STORAGE_BUCKET || "").trim(),
              VITE_FIREBASE_MESSAGING_SENDER_ID: (process.env.VITE_FIREBASE_MESSAGING_SENDER_ID || "").trim(),
              VITE_FIREBASE_APP_ID: (process.env.VITE_FIREBASE_APP_ID || "").trim(),
            };
            const required = [
              "VITE_FIREBASE_API_KEY",
              "VITE_FIREBASE_AUTH_DOMAIN",
              "VITE_FIREBASE_PROJECT_ID",
              "VITE_FIREBASE_APP_ID",
            ];
            if (required.some((k) => !current[k])) {
              const res = await fetch("https://mojis-heritage-ae06c.web.app/__/firebase/init.json");
              if (!res.ok) {
                throw new Error("Unable to fetch Firebase Hosting init.json (" + res.status + ")");
              }
              const initConfig = await res.json();
              const mapping = {
                VITE_FIREBASE_API_KEY: initConfig.apiKey,
                VITE_FIREBASE_AUTH_DOMAIN: initConfig.authDomain,
                VITE_FIREBASE_PROJECT_ID: initConfig.projectId,
                VITE_FIREBASE_STORAGE_BUCKET: initConfig.storageBucket,
                VITE_FIREBASE_MESSAGING_SENDER_ID: initConfig.messagingSenderId,
                VITE_FIREBASE_APP_ID: initConfig.appId,
              };
              for (const [k, v] of Object.entries(mapping)) {
                if (!current[k] && v) {
                  current[k] = String(v).trim();
                }
              }
            }
            const missing = required.filter((k) => !current[k]);
            if (missing.length > 0) {
              console.error("Missing required Firebase build configuration:", missing.join(", "));
              process.exit(1);
            }
            for (const [k, v] of Object.entries(current)) {
              if (v) {
                if (k === "VITE_FIREBASE_API_KEY" || k === "VITE_FIREBASE_APP_ID") {
                  console.log("::add-mask::" + v);
                }
                fs.appendFileSync(envFile, `${k}=${v}\n`, "utf8");
              }
            }
            console.log("Verified all required VITE_FIREBASE_* variables are present for Vite production build.");
          '

      - name: Build production bundle
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_YOUTUBE_CHANNEL_URL: ${{ secrets.VITE_YOUTUBE_CHANNEL_URL || vars.VITE_YOUTUBE_CHANNEL_URL || 'https://www.youtube.com/@mojisheritage7850' }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY || vars.VITE_WEB3FORMS_ACCESS_KEY }}
        run: npm run build

      - name: Deploy updated snapshot and site to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOJIS_HERITAGE_AE06C }}
          channelId: live
          projectId: mojis-heritage-ae06c
